name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet run --project tests/RoboDock.Core.Tests -c Release

      - name: Publish
        run: >
          dotnet publish src/RoboDock.App -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/RoboDock.App.exe, README.md, LICENSE -DestinationPath RoboDock-${{ github.ref_name }}-win-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: RoboDock-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
